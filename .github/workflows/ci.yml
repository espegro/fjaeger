name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: RP2350 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Pico SDK 2.2.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure and build firmware
        run: |
          cmake -S . -B build \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=waveshare_rp2350_plus_16mb
          cmake --build build --parallel
          test -s build/fjaeger.elf
          test -s build/fjaeger.uf2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fjaeger-${{ github.sha }}
          path: |
            build/fjaeger.elf
            build/fjaeger.uf2

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitize: ["", "asan-ubsan"]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential libmbedtls-dev

      # Most host tests compile the firmware sources with cc against
      # stubbed crypto/state layers; they run without the Pico SDK.
      - name: Build and run host tests
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.sanitize }}" = "asan-ubsan" ]; then
            EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          COMMON="-std=c11 -Wall -Wextra -Werror $EXTRA"

          cc $COMMON -Itests/stubs -Isrc/core -Isrc/fido -Isrc/usb -Isrc/led \
            tests/test_security.c src/core/state.c -o /tmp/fjaeger-test-security
          /tmp/fjaeger-test-security

          cc $COMMON -Isrc/core -Isrc/fido -Isrc/led \
            tests/test_ctap2.c src/fido/ctap2.c src/fido/cbor.c src/fido/pin.c \
            -o /tmp/fjaeger-test-ctap2
          /tmp/fjaeger-test-ctap2

          cc $COMMON -Isrc/core -Isrc/fido -Isrc/led \
            tests/test_profile.c src/fido/ctap2.c src/fido/cbor.c src/fido/pin.c \
            -o /tmp/fjaeger-test-profile
          /tmp/fjaeger-test-profile

          cc $COMMON -Itests/stubs -Isrc/core -Isrc/fido -Isrc/usb -Isrc/led \
            tests/test_profile_erase.c src/core/state.c src/fido/ctap2.c \
            src/fido/cbor.c src/fido/pin.c -o /tmp/fjaeger-test-profile-erase
          /tmp/fjaeger-test-profile-erase

          # The HMAC/PBKDF2 host test is self-contained (no Pico SDK/mbedTLS)
          # and verifies the production HMAC/PBKDF2 construction against
          # RFC 4231 (HMAC) and RFC 7914 (PBKDF2) vectors. The other tests
          # stub these out, so this is the only check of the real algorithm.
          cc $COMMON -Isrc/core \
            tests/test_hmac.c -o /tmp/fjaeger-test-hmac
          /tmp/fjaeger-test-hmac

          cc $COMMON -Isrc/core -Ithird_party/monocypher \
            tests/test_ed25519.c src/core/ed25519.c \
            third_party/monocypher/monocypher.c \
            third_party/monocypher/monocypher-ed25519.c \
            -o /tmp/fjaeger-test-ed25519
          /tmp/fjaeger-test-ed25519

          cc $COMMON -Isrc/core \
            tests/test_crypto_gcm.c src/core/crypto.c -lmbedcrypto \
            -o /tmp/fjaeger-test-crypto-gcm
          /tmp/fjaeger-test-crypto-gcm
  fuzz:
    name: Parser fuzzing (FJ-N009)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build and run fuzzers (libFuzzer smoke)
        run: |
          set -e
          INC="-Isrc/core -Isrc/fido -Isrc/led"
          FZ="-std=c11 -Wall -Wextra -Werror -fsanitize=fuzzer,address,undefined"
          clang $FZ $INC fuzz/fz_cbor.c src/fido/cbor.c -o /tmp/fz_cbor
          clang $FZ $INC fuzz/fz_ctap2.c src/fido/ctap2.c src/fido/cbor.c src/fido/pin.c fuzz/stubs.c -o /tmp/fz_ctap2
          /tmp/fz_cbor  -max_len=2048 -runs=20000 fuzz/corpus
          /tmp/fz_ctap2 -max_len=2048 -runs=20000 fuzz/corpus

      - name: gcc + ASAN driver smoke
        run: |
          set -e
          INC="-Isrc/core -Isrc/fido -Isrc/led"
          F="-std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined"
          cc $F $INC fuzz/driver.c fuzz/fz_cbor.c src/fido/cbor.c -o /tmp/drv_cbor
          cc $F $INC -DFZ_CTAP2 fuzz/driver.c fuzz/fz_ctap2.c src/fido/ctap2.c src/fido/cbor.c src/fido/pin.c fuzz/stubs.c -o /tmp/drv_ctap2
          /tmp/drv_cbor  fuzz/corpus/*
          /tmp/drv_ctap2 fuzz/corpus/*
